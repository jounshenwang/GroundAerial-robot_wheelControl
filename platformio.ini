; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep
lib_deps = pololu/VL53L1X@^1.0.0

; ⚠️ 关键修复 (两行都要，缺一不可):
;   1. ARDUINO_USB_MODE=0 → USB 走 USB-Serial-JTAG，app_main 才会调用 Serial.begin()
;   2. ARDUINO_USB_CDC_ON_BOOT=1 → Serial0 从物理 UART0(GPIO43/44) 改到 USB
;   否则 Serial0(UART0,115200) 和 Serial1(UART1,921600) 同时占用 GPIO43/44 → 全乱码
build_flags =
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-S3 烧录优化
board_build.flash_mode = dio
board_upload.flash_size = 8MB
board_resetdelay = 200
upload_speed = 115200